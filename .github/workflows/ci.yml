name: Private application validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env: {POSTGRES_USER: baize, POSTGRES_PASSWORD: test-only, POSTGRES_DB: baize_test}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U baize' --health-interval 5s --health-retries 20
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://baize:test-only@127.0.0.1:5432/baize_test
      TEST_DATABASE_URL: postgres://baize:test-only@127.0.0.1:5432/baize_test
      REDIS_URL: redis://127.0.0.1:6379
      DATA_DIR: /tmp/baize-ci
      KEYS_DIR: /tmp/baize-ci-keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node --import tsx scripts/ops-sdk-test.ts
      - run: node scripts/ops-journal-test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:integration
      - name: Start real app and wait for storage health
        run: |
          npm start > /tmp/baize-ci-app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/baize-ci-app.log
          exit 1
      - run: npm run test:e2e
      - run: bash scripts/ops-lifecycle-test.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: validation-errors, path: 'test-results/'}
