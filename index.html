<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#12302B"/><script>try{var q=new URLSearchParams(location.search),t=q.get('theme');if(t!=='dark'&&t!=='light')t=localStorage.getItem('baize-theme');if(t!=='dark'&&t!=='light')t='light';document.documentElement.dataset.theme=t;var off=q.get('motion')==='off'||matchMedia('(prefers-reduced-motion: reduce)').matches;document.documentElement.dataset.motion=off?'off':'on';if(off)document.documentElement.classList.add('rm')}catch(e){}</script><title>白泽 · 网站分析</title></head><body><div id="root"></div><script type="module" src="/src/web/main.tsx"></script></body></html>
