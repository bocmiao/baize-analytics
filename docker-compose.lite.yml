services:
  app:
    image: ${BAIZE_LITE_IMAGE:-baize-analytics:lite-local}
    build:
      context: .
      dockerfile: Dockerfile.lite
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    user: "${BAIZE_UID:-1000}:${BAIZE_GID:-1000}"
    ports: ["127.0.0.1:${BAIZE_LITE_PORT:-3000}:3000"]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DATA_DIR: /app/data
      KEYS_DIR: /app/keys
    volumes:
      - lite_data:/app/data
      - lite_keys:/app/keys
volumes:
  lite_data:
  lite_keys:
