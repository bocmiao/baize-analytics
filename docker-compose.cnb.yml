# CI runner and real services share one daemon-side network; no host bind mounts.
services:
  runner:
    image: ${CI_RUNNER_IMAGE:-baize-cnb-ci:local}
    build: {context: ., dockerfile: Dockerfile.ci}
    init: true
    shm_size: 512mb
    environment:
      CI_RUNNER_IN_COMPOSE: '0'
      CI_START_SERVICES: '0'
      CI_CONTAINER_RUNNER: '1'
      DATABASE_URL: postgres://baize:ci-local-only@postgres:5432/baize_ci
      TEST_DATABASE_URL: postgres://baize:ci-local-only@postgres:5432/baize_ci
      CLICKHOUSE_TEST_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379/0
      CI_PORT: '3391'
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
  postgres:
    image: postgres:17-bookworm
    environment: {POSTGRES_USER: baize, POSTGRES_PASSWORD: ci-local-only, POSTGRES_DB: baize_ci}
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U baize -d baize_ci'], interval: 2s, timeout: 3s, retries: 40}
  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
    environment: {CLICKHOUSE_USER: baize, CLICKHOUSE_PASSWORD: local-test-only, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'}
    healthcheck: {test: [CMD-SHELL, "clickhouse-client --user baize --password local-test-only --query 'SELECT 1' >/dev/null"], interval: 2s, timeout: 3s, retries: 50}
  redis:
    image: redis:7-bookworm
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30}
