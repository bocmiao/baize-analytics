# Manual only: owner requires all autonomous work/local checks finished before hosted CI.
# GitHub private main remains authoritative. No push, cron or NPC pipeline.
main:
  web_trigger_validate:
    - docker:
        image: node:24-bookworm
      services: [docker]
      stages:
        - name: final-manual-application-validation
          script: CI_RUNNER_IN_COMPOSE=1 bash scripts/ci-common.sh regular
  web_trigger:
    - imports:
        - https://cnb.cool/bankermiao/baize-ci-secrets/-/blob/main/github.yml
      docker:
        image: node:24-bookworm
      env:
        CNB_MIRROR_URL: https://cnb.cool/bankermiao/baize-analytics
      stages:
        - name: final-manual-private-main-sync
          script: SYNC_RUN_REGULAR_CI=0 bash scripts/sync-main-cnb.sh
